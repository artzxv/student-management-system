<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Dashboard - Student Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            display: flex;
            flex-direction: column;
        }


        /* =========================
           SIDEBAR TITLE + LOGO
        ========================= */

        .sidebar-title {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 8px;

            margin-bottom: 18px;
        }

        .sidebar-title h2 {
            margin: 0;

            text-align: left;

            font-size: 18px;

            line-height: 1.2;
        }

        .school-logo {
            width: 50px;
            height: 50px;

            object-fit: contain;

            border-radius: 5px;

            flex-shrink: 0;
        }


        /* =========================
           ADMIN PROFILE
        ========================= */

        .admin-profile {
            display: flex;
            align-items: center;

            gap: 9px;

            margin-bottom: 25px;

            padding-left: 0;
        }

        .admin-circle {
            width: 34px;
            height: 34px;

            background: white;

            color: #1565c0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        .admin-profile span {
            font-size: 14px;

            font-weight: 600;
        }


        /* =========================
           SIDEBAR NAVIGATION
        ========================= */

        .sidebar nav {
            display: flex;

            flex-direction: column;

            gap: 8px;
        }

        .sidebar nav a {
            display: block;

            width: 100%;

            padding: 12px 15px;

            border-radius: 7px;

            background: transparent;

            color: white;

            text-decoration: none;

            font-size: 14px;
        }

        .sidebar nav a:hover {
            background: #0d47a1;
        }


        /* =========================
           LOGOUT
        ========================= */

        .sidebar-bottom {
            margin-top: auto;
        }

        .sidebar-bottom button {
            display: block;

            width: 100%;

            padding: 12px 15px;

            border: none;

            border-radius: 7px;

            background: #f57c00;

            color: white;

            text-align: center;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        .sidebar-bottom button:hover {
            background: #e66f00;
        }


        /* =========================
           DASHBOARD CARDS
        ========================= */

        .dashboard-cards {
            display: flex;

            gap: 20px;

            margin-top: 30px;
        }

        .dashboard-card {
            width: 240px;

            background: white;

            padding: 25px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);

            border-left: 5px solid #1565c0;
        }

        .dashboard-card h3 {
            margin: 0 0 12px;

            font-size: 15px;

            color: #555;
        }

        .dashboard-card p {
            margin: 0;

            font-size: 32px;

            font-weight: bold;

            color: #1565c0;
        }


        /* =========================
           SMALLER SCREEN
        ========================= */

        @media (max-width: 700px) {

            .dashboard-cards {
                flex-direction: column;
            }

            .dashboard-card {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <div class="dashboard-container">


        <!-- SIDEBAR -->

        <aside class="sidebar">


            <!-- TITLE + SCHOOL LOGO -->

            <div class="sidebar-title">

                <h2>
                    Student Management
                </h2>

                <img
                    src="logo/slogo.jpg"
                    alt="Vision Academy Logo"
                    class="school-logo"
                >

            </div>


            <!-- ADMIN -->

            <div class="admin-profile">

                <div class="admin-circle">
                    👤
                </div>

                <span>
                    Admin
                </span>

            </div>


            <!-- NAVIGATION -->

            <nav>

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="students.html">
                    Students
                </a>

                <a href="add-student.html">
                    Add Student
                </a>

            </nav>


            <!-- LOGOUT -->

            <div class="sidebar-bottom">

                <button id="logoutButton">
                    Logout
                </button>

            </div>


        </aside>


        <!-- MAIN CONTENT -->

        <main class="main-content">


            <h1>
                Dashboard
            </h1>


            <!-- DASHBOARD CARDS -->

            <div class="dashboard-cards">


                <!-- TOTAL STUDENTS -->

                <div class="dashboard-card">

                    <h3>
                        Total Students
                    </h3>

                    <p id="totalStudents">
                        0
                    </p>

                </div>


                <!-- TOTAL PROGRAMS -->

                <div class="dashboard-card">

                    <h3>
                        Total Programs
                    </h3>

                    <p id="totalPrograms">
                        0
                    </p>

                </div>


            </div>


        </main>

    </div>


    <script
        type="module"
        src="js/dashboard.js"
    ></script>


</body>

</html>
